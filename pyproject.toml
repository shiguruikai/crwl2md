[project]
name = "web2md"
version = "0.1.0"
description = "CLI tool to crawl websites and convert pages into Markdown files"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "crawl4ai>=0.9.5",
  "httpx>=0.28.1",
  "lxml>=6.1.3",
  "markdownify>=1.2.3",
  "pydantic>=2.14.3",
]

[project.scripts]
web2md = "web2md.cli:main"

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = ["-q", "--tb=short"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
