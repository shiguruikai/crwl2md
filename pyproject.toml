[project]
name = "web2md"
version = "0.1.0"
description = "ウェブサイトをクロールして Markdown ファイル群に変換する CLI ツール"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "beautifulsoup4>=4.13.0",
  "crawl4ai>=0.9.0",
  "httpx>=0.28.0",
  "lxml>=5.3.0",
  "markdownify>=1.1.0",
  "pydantic>=2.11.0",
  "readability-lxml>=0.8.1",
  "trafilatura>=2.0.0",
]

[project.scripts]
web2md = "web2md.cli:main"

[dependency-groups]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.15"]
build-backend = "uv_build"

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
