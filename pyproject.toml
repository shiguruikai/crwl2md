[project]
name = "crwl2md"
version = "0.2.0"
description = "CLI tool to crawl websites and convert pages into Markdown files"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "shiguruikai" }]
keywords = ["cli", "crawl4ai", "crawler", "documentation", "html", "markdown"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Typing :: Typed",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "crawl4ai>=0.9.6,<0.10",
  "lxml>=5.3,<7",
  "markdownify>=1.0.0,<2",
  "playwright>=1.64.1",
  "pydantic>=2.10",
]

[project.urls]
Homepage = "https://github.com/shiguruikai/crwl2md"
Issues = "https://github.com/shiguruikai/crwl2md/issues"
Repository = "https://github.com/shiguruikai/crwl2md"

[project.scripts]
crwl2md = "crwl2md.cli:main"

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = ["-q", "--tb=short"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
